name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Lint and syntax checks
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Catalog HTTP layout check
        run: node scripts/test-catalog-http.mjs